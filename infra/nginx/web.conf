server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Gzip static assets for faster delivery.
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml;

    # Cache-control: long-lived for content-hashed assets, no-cache for entry point.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Runtime configuration mounted from the web-runtime-config ConfigMap.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Same-origin relay for browser telemetry (src/web/src/telemetry.ts).
    location = /telemetry/v2/track {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        proxy_http_version 1.1;
        proxy_set_header Host southcentralus-3.in.applicationinsights.azure.com;
        proxy_ssl_server_name on;
        proxy_pass https://southcentralus-3.in.applicationinsights.azure.com/v2/track;
    }

    # Kubernetes readiness/liveness probe endpoint (no file read, pure nginx).
    location = /healthz {
        access_log  off;
        return      200 'ok';
        add_header  Content-Type text/plain;
    }

    # SPA fallback: anything that doesn't match a real file serves index.html so
    # the React router can handle client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
