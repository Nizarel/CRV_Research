server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml font/woff2;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location = /telemetry/v2/track {
        proxy_http_version 1.1;
        proxy_set_header Host southcentralus-3.in.applicationinsights.azure.com;
        proxy_ssl_server_name on;
        proxy_pass https://southcentralus-3.in.applicationinsights.azure.com/v2/track;
    }

    location / {
        try_files $uri /index.html;
    }
}