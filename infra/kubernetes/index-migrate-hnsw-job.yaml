apiVersion: batch/v1
kind: Job
metadata:
  name: index-migrate-hnsw-20260828
  namespace: crv
  labels:
    app: index-migrate
    operation: build-hnsw
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: index-migrate
        operation: build-hnsw
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: crv
      containers:
        - name: index-migrate
          image: acrcrvscus.azurecr.io/crv-index-migrate@sha256:1697dc03d94f4d673c0f5a2298d6f9ecf127957eb0cfaef7e10aa17335d3fa6c
          command: ["/bin/sh", "-c"]
          args:
            - >-
              index-migrate reconcile &&
              index-migrate build-hnsw &&
              index-migrate reconcile &&
              index-migrate verify-hnsw
          env:
            - name: AZURE_CLIENT_ID
              value: "390adbf3-2f0e-4f3d-b6ca-cdc0628cd055"
            - name: AZURE_POSTGRES_HOST
              value: psql-nyuwyhzhjriuu-ncus-085512.postgres.database.azure.com
            - name: AZURE_POSTGRES_USER
              value: id-crv-aks-workload
            - name: AZURE_POSTGRES_RETRIEVAL_DB
              value: retrieval-eval
