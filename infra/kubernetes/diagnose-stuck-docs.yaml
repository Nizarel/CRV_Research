apiVersion: batch/v1
kind: Job
metadata:
  generateName: diagnose-stuck-docs-
  namespace: crv
  labels:
    app: diagnose-stuck-docs
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2700
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: diagnose-stuck-docs
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: crv
      containers:
        - name: diagnose
          image: acrcrvscus.azurecr.io/crv-ingestion:cache-conflict-fix-20260723a
          command: ["python", "/scripts/diagnose_stuck_docs.py"]
          env:
            - name: AZURE_CLIENT_ID
              value: "390adbf3-2f0e-4f3d-b6ca-cdc0628cd055"
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: script
          configMap:
            name: diagnose-stuck-docs-script
