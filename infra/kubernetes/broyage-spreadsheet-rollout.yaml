apiVersion: batch/v1
kind: Job
metadata:
  name: broyage-spreadsheet-rollout
  namespace: crv
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: crv
      containers:
        - name: rollout
          image: acrcrvscus.azurecr.io/crv-ingestion:spreadsheet-lane-20260724
          imagePullPolicy: IfNotPresent
          env:
            - name: AZURE_CLIENT_ID
              value: 390adbf3-2f0e-4f3d-b6ca-cdc0628cd055
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "=== manifest-blob ==="
              python -m ingestion.cli manifest-blob \
                --account stnyuwyhzhjriuu \
                --container content \
                --prefix "2-Zone Broyage/" \
                --output /tmp/broyage.jsonl
              echo "=== forget-unrouted ==="
              python -m ingestion.cli forget-unrouted \
                --route spreadsheet \
                --prefix "2-Zone Broyage/" \
                --pg-host psql-nyuwyhzhjriuu-ncus-085512.postgres.database.azure.com \
                --pg-user id-crv-aks-workload \
                --pg-database ingestion-catalog
              echo "=== enqueue-manifest ==="
              python -m ingestion.cli enqueue-manifest \
                --manifest /tmp/broyage.jsonl \
                --route spreadsheet \
                --prefix "2-Zone Broyage/" \
                --service-bus-namespace sb-nyuwyhzhjriuu.servicebus.windows.net \
                --queue-name ingestion-work
              echo "=== done ==="
