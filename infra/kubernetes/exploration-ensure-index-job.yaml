apiVersion: batch/v1
kind: Job
metadata:
  generateName: exploration-ensure-index-
  namespace: crv-exploration
  labels:
    app: exploration-ensure-index
    workstream: exploration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: exploration-ensure-index
        workstream: exploration
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: crv-exploration
      containers:
        - name: ensure-index
          image: acrcrvscus.azurecr.io/crv-exploration:${EXPLORATION_IMAGE_TAG}
          args:
            - ensure-index
            - --index-name
            - expl-content-v2
            - --search-endpoint
            - https://gptkb-nyuwyhzhjriuu.search.windows.net
            - --foundry-url
            - https://cog-nyuwyhzhjriuu.cognitiveservices.azure.com
          env:
            - name: AZURE_CLIENT_ID
              value: ${EXPLORATION_IDENTITY_CLIENT_ID}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
