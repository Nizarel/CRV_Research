server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Content-hashed build output is immutable.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # The research backend runs in the same pod and listens on loopback only.
    location = /api/ready {
        access_log off;
        proxy_pass http://127.0.0.1:8000/health/ready;
    }

    # POST /api/v1/chat streams Server-Sent Events for up to the 180 s turn budget.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 330s;
        proxy_send_timeout 60s;
        client_max_body_size 64k;
    }

    # Anything else under /api (docs, schema, health detail) stays internal.
    location /api/ {
        return 404;
    }

    location / {
        try_files $uri /index.html;
    }
}
