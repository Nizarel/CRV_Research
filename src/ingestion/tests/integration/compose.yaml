# Ephemeral PostgreSQL 16 + Apache AGE 1.6.0 + pgvector for the pipeline integration tests.
# The database is never published to the host; the password is a throwaway test value.
name: tizert-pipeline-integration

services:
  age:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    # Azure Database for PostgreSQL runs with jit=off; with the image default (on), compiling
    # the large kg release queries takes several seconds each.
    command: ["postgres", "-c", "jit=off"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration-only
      POSTGRES_DB: ingestion-catalog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ingestion-catalog"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: ../../../..
      dockerfile: Dockerfile.pipeline
      target: test
    environment:
      TIZ_TEST_PG_DSN: postgresql://postgres:integration-only@age:5432/ingestion-catalog
    depends_on:
      age:
        condition: service_healthy
    command:
      ["python", "-m", "pytest", "tests", "--ignore=tests/tools", "-q", "-p", "no:cacheprovider", "-m", "integration or contract"]
